[project]
name = "searxng-mcp"
version = "0.1.0"
description = "MCP server for SearXNG web search and page extraction"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
]

[project.scripts]
searxng-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
